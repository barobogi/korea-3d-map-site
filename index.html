<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대한민국 3D 지도 · 비공개 베타</title>
<style>
:root{--bg:#0b111e;--panel:#111a2e;--line:#24324f;--fg:#f1f5f9;--sub:#94a3b8;--open:#38bdf8;--wait:#475569}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans KR",sans-serif}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto}h1{font-size:1.3rem;margin:0 0 6px}p.sub{color:var(--sub);margin:0;font-size:.9rem}
main{max-width:720px;margin:0 auto;padding:8px 16px 80px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:1rem;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
a.block,div.block{display:block;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;min-height:84px}
a.block{border-color:var(--open)}a.block:focus-visible{outline:3px solid #fff}
.tag{font-size:.75rem;color:var(--sub)}.open .tag{color:var(--open)}
#mapwrap{position:relative;margin:8px 0 4px}#map{width:100%;height:auto;max-height:62vh;background:#0e1626;border:1px solid var(--line);border-radius:14px}#map path{fill:#243049;stroke:#0b111e;stroke-width:.5;cursor:default}#map path.open{fill:#38bdf8;stroke:#e0f2fe;stroke-width:1.2;cursor:pointer}#map path.open:hover{fill:#7dd3fc}#map path.soon:hover{fill:#2f3d5c}#tip{min-height:1.2em;margin-top:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b111ee6;border-top:1px solid var(--line);padding:10px 16px;font-size:.75rem;color:var(--sub);text-align:center}
footer a{color:var(--open)}
</style>
</head>
<body>
<header>
<h1>대한민국 3D 지도 <span class="tag">비공개 베타</span></h1>
<p class="sub">동네를 눌러 입체 지도로 들어갑니다. 열린 동네는 단계적으로 늘어납니다.</p>
</header>
<main>
<a id="today" class="block open" href="#" style="display:none;margin:10px 0"><span class="tag">오늘의 한 장면</span><br><b id="todayName"></b><div class="tag">눌러서 3D로 바로 보기</div></a>
<div id="mapwrap"><svg id="map" viewBox="0 0 600 700" role="img" aria-label="대한민국 시군구 지도. 열린 동네는 하늘색"></svg><div id="tip" class="tag"></div></div>
<label for="q" class="tag">동네 검색</label>
<input id="q" type="search" placeholder="예: 종로구" autocomplete="off">
<div class="grid" id="grid"></div>
<p class="tag" id="status"></p>
</main>
<footer><a href="ATTRIBUTION.md">출처·라이선스</a> · <a href="https://github.com/barobogi/korea-3d-map/issues/new?template=error_report.yml">오류 신고</a> · 데이터 확인일은 각 동네 화면에 표시됩니다</footer>
<script>
fetch('data/regions.json',{cache:'no-store'}).then(r=>r.json()).then(function(d){
 var grid=document.getElementById('grid'),q=document.getElementById('q'),st=document.getElementById('status');
 function draw(){var t=q.value.trim();grid.innerHTML='';var n=0;
  d.regions.forEach(function(r){if(t&&r.name.indexOf(t)<0)return;n++;
   var open=r.status==='open',el=document.createElement(open?'a':'div');
   el.className='block'+(open?' open':'');if(open)el.href='b/'+r.code+'/';
   var b=document.createElement('b');b.textContent=r.name;
   var s=document.createElement('div');s.className='tag';s.textContent=open?'열림 · '+r.blocks+'개 랜드마크':'준비중';
   el.appendChild(b);el.appendChild(s);grid.appendChild(el);});
  st.textContent='열린 동네 '+d.regions.filter(function(r){return r.status==='open'}).length+' · 나머지 시군구는 순차 공개'+(n?'':' · 검색 결과 없음');}
 q.addEventListener('input',draw);draw();
}).catch(function(){document.getElementById('status').textContent='동네 목록을 불러오지 못했습니다. 새로고침해 주세요.';});

fetch('data/sgg.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
 var svg=document.getElementById('map'),tip=document.getElementById('tip'),NS='http://www.w3.org/2000/svg';
 var k=95,cx=Math.cos(36*Math.PI/180);
 function X(lng){return (lng-124.5)*cx*k+10}function Y(lat){return (38.7-lat)*k+10}
 var openG=document.createDocumentFragment();
 d.regions.forEach(function(r){var p=document.createElementNS(NS,'path');
  p.setAttribute('d',r.rings.map(function(g){return 'M'+g.map(function(q){return X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)}).join('L')+'Z'}).join(''));
  p.setAttribute('class',r.status==='open'?'open':'soon');
  var t=document.createElementNS(NS,'title');t.textContent=r.province+' '+r.name+(r.status==='open'?' · 열림':' · 준비중');p.appendChild(t);
  p.addEventListener('mouseenter',function(){tip.textContent=r.province+' '+r.name+(r.status==='open'?' · 열림':' · 준비중')});
  p.addEventListener('click',function(){if(r.status==='open'){location.href='b/'+r.code+'/'}else{tip.textContent=r.name+': 아직 준비중입니다'}});
  if(r.status==='open')openG.appendChild(p);else svg.appendChild(p)});
 svg.appendChild(openG);
 d.regions.filter(function(r){return r.status==='open'}).forEach(function(r){
  var xs=[],ys=[];r.rings.forEach(function(g){g.forEach(function(q){xs.push(X(q[0]));ys.push(Y(q[1]))})});
  var mx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2,my=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
  var g=document.createElementNS(NS,'g');g.setAttribute('style','cursor:pointer');
  var c=document.createElementNS(NS,'circle');c.setAttribute('cx',mx);c.setAttribute('cy',my);c.setAttribute('r',9);c.setAttribute('fill','none');c.setAttribute('stroke','#38bdf8');c.setAttribute('stroke-width','2.5');
  var c2=document.createElementNS(NS,'circle');c2.setAttribute('cx',mx);c2.setAttribute('cy',my);c2.setAttribute('r',3.5);c2.setAttribute('fill','#38bdf8');
  var t=document.createElementNS(NS,'text');t.setAttribute('x',mx+13);t.setAttribute('y',my+4);t.setAttribute('fill','#e0f2fe');t.setAttribute('font-size','13');t.setAttribute('font-weight','700');t.textContent=r.name+' (열림)';
  g.appendChild(c);g.appendChild(c2);g.appendChild(t);g.addEventListener('click',function(){location.href='b/'+r.code+'/'});svg.appendChild(g);
 });
});

fetch('data/blocks.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
 var base={'03045_HERO_p01_경복궁_근정전':1,'03045_HERO_p02_경복궁_경회루':1,'03188_WATER_p21_청계천_단면음각_수로':1};
 var pool=[];d.blocks.forEach(function(b,i){ if(!base[b.id] && b.id.indexOf('cheonggye_v2')<0) pool.push({i:i,label:b.label}); });
 if(!pool.length) return;
 var day=Math.floor((Date.now()+9*3600e3)/864e5), pick=pool[day%pool.length];
 var a=document.getElementById('today'); document.getElementById('todayName').textContent='종로 · '+pick.label.replace(/^#\d+\s*/,'');
 a.href='b/11110/#lego=x'+pick.i; a.style.display='block';
}).catch(function(){});
</script>
</body>
</html>
