<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>서울특별시 송파구 3D 지도 (잠실·롯데월드타워 중심)</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#0e1726;color:#e8eefc;font-family:'Malgun Gothic',sans-serif}
 canvas{display:block;filter:brightness(1.65) saturate(0.62) url(#edgeSharpen)}   /* 인라인 캔버스의 하단 여백(descender) 제거 */
 /* 2026-10-22 신안군 보정: 엣지 대비·샤프닝 강화 + 채도 감쇠 — quality4_nosky 재측정 대응 */
 #hud{position:absolute;left:12px;top:10px;z-index:9;font-size:13px;line-height:1.6;background:rgba(10,18,32,.82);
      padding:10px 13px;border:1px solid #24334d;border-radius:9px;
      max-width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 150px);overflow:auto;box-sizing:border-box}
 #hud b{color:#7fd1ff} .k{color:#9fb6d6} .warn{color:#ff8b9e}
 /* 적용안 3(2026-10-22): 지역명 + 상위 지명 5개는 1줄 고정(넘치면 말줄임) */
 #regionLine{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #hs{width:110px;vertical-align:-4px;accent-color:#7fd1ff}
 #legend{position:absolute;left:12px;bottom:12px;z-index:9;font-size:12px;line-height:1.7;
      background:rgba(10,18,32,.82);padding:9px 13px;border:1px solid #24334d;border-radius:9px;
      max-width:calc(100vw - 24px);box-sizing:border-box}
 #legend span{white-space:nowrap;margin-right:8px}   /* 항목 단위로만 줄바꿈 → 1280에서 잘림 방지 */
 #legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
 button{background:#1b2b44;color:#e8eefc;border:1px solid #2c4468;border-radius:6px;padding:4px 9px;margin-right:4px;cursor:pointer}
 button.on{background:#2b6cb0}
 .mono{font-family:Consolas,monospace;font-size:12px;color:#9fb6d6}
 @media (max-width:1366px){
   #hud{font-size:12px;padding:8px 10px;max-height:calc(100vh - 130px)}
   #legend{font-size:11px;padding:7px 10px}
 }
</style></head><body>
<div id="hud">
  <b>송파구 1km 타일 뷰어 (건물 + 바닥)</b><br>
  <span id="regionLine"><b id="regionName">송파구</b> · <span class="k">상위 지명</span> <span id="placeNames">불러오는 중…</span></span><br>
  <span class="k">반경</span>
  <button data-km="1">1km</button><button data-km="2" class="on">2km</button><button data-km="3">3km</button>
  <button id="gbtn" class="on">바닥 ON/OFF</button>
  <button id="req">타일 로딩</button><br>
  <span class="k">높이</span> <input id="hs" type="range" min="0.2" max="3" step="0.1" value="1"> <span class="mono" id="hsv">1.0×</span><br>
  <span id="stat">대기 중…</span><br>
  <span class="mono" id="detail"></span><br>
  <span class="k">드래그=회전 · 휠=확대</span>
</div>
<div id="legend">
  <b>바닥</b>
  <span><i style="background:#aeb4c4"></i>도로</span><span><i style="background:#338caa"></i>수면</span>
  <span><i style="background:#357a4f"></i>녹지</span><span><i style="background:#73798a"></i>철도</span>
  <span><i style="background:#212e40"></i>토지이용</span>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <filter id="edgeSharpen" x="0" y="0" width="100%" height="100%">
  <feConvolveMatrix order="3" divisor="1" bias="0" edgeMode="duplicate" preserveAlpha="true"
                    kernelMatrix="0 -1.5 0 -1.5 7 -1.5 0 -1.5 0"/>
 </filter>
</svg>
<script src="./../../vendor/three.min.js"></script>
<script>
const REGION = '송파구';
const ASSET = './';   // 자산(타일·vendor) 상대경로 접두 — 후보를 pilot/candidates/에 두기 위한 인자(2026-10-23)
const LON = 88000, LAT = 111000, HSCALE = 1.0;
const scene = new THREE.Scene();
// ── 2026-10-23 트랙 A(만복 12:25 승인): 원경 배경 = 단색 → 수평선 그라데이션 ──
// 왜: 단색 배경은 원경이 '벽'처럼 보이고 4지표 밝기가 기준(88.6) 대비 크게 낮았다(62.6).
(function sky(){
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 256;
  const cx = cv.getContext('2d');
  const gr = cx.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0.00, '#16324f');
  gr.addColorStop(0.55, '#33587a');
  gr.addColorStop(0.80, '#7c9ab4');
  gr.addColorStop(1.00, '#a8bccd');
  cx.fillStyle = gr; cx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter;
  scene.background = tex;
})();
scene.fog = new THREE.Fog(0x5d7691, 3000, 20000);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 200000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
// 2026-10-23 트랙 A: 그림자 활성(PCFSoft)
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// ── 2026-10-23 트랙 A: 태양광 방향 조명 + 그림자 + 주변광 보정 ──
const SUN_AZ = -1.35, SUN_EL = 0.55;   // 태양 방위·고도(rad) — 고정값(재현 가능)
const sunDir = new THREE.Vector3(-Math.cos(SUN_EL)*Math.sin(SUN_AZ), Math.sin(SUN_EL), -Math.cos(SUN_EL)*Math.cos(SUN_AZ));
const SH_COVER = 4500;                 // 그림자 카메라 커버(±m). 2km 초기 시야(±3.2km) 안
const dl = new THREE.DirectionalLight(0xfff3dc, 1.55);
dl.position.copy(sunDir).multiplyScalar(9000);
dl.castShadow = true;
dl.shadow.mapSize.set(2048, 2048);
dl.shadow.camera.left = -SH_COVER; dl.shadow.camera.right = SH_COVER;
dl.shadow.camera.top = SH_COVER; dl.shadow.camera.bottom = -SH_COVER;
dl.shadow.camera.near = 200; dl.shadow.camera.far = 24000;
dl.shadow.camera.updateProjectionMatrix();
dl.shadow.bias = -0.0006; dl.shadow.normalBias = 6;
scene.add(dl); scene.add(dl.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.34));
scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x2a3346, 0.55));
window.__track_a = {shadow: true, shadow_map: 2048, cover: SH_COVER,
  sun: [+sunDir.x.toFixed(3), +sunDir.y.toFixed(3), +sunDir.z.toFixed(3)],
  sun_az: SUN_AZ, sun_el: SUN_EL, intensity: 1.55, ambient: 0.34, hemi: 0.55,
  sky: 'gradient', plane: '0x263549', wall_k: 0.80, stamp: '20261023'};

let MAN = null, GMAN = null, CENTER = null, MESH = null, KM = 2;
let EDGE = null;                 // 건물 외곽선(엣지 대비 강화, 2026-10-22 신안군 보정)
let G_PLANE = null, G_FILL = null, G_LINE = null;
let G_ON = true;
let HSCALE_UI = 1.0;             // 높이 과장 슬라이더(건물 메쉬 y배율) — 재로딩 없이 즉시 반영
const loadedTiles = new Set();

function toXZ(lon, lat){ return [ (lon - CENTER[0]) * LON, -(lat - CENTER[1]) * LAT ]; }

// ── 건물 기둥(지붕 삼각분할 + 벽면) ──
// 2026-10-22 신안군 보정(만복 20:36 지시): 벽면 = 지붕색 × 0.70 (지붕/벽면 색 분리).
//   벽면 정점색만 WALL_K로 낮춰 지붕 대비 음영을 만든다(지오메트리·데이터 변경 없음, 렌더만).
const WALL_K = 0.80;
// 2026-10-23 후보 c3 실험 손잡이: 벽면 모서리 수직 엣지(0=현행 그대로, 1=추가).
const WALL_EDGES = 1;
function prism(ring, h, pos, norm, col){
  const contour = [], n = ring.length;
  for (let i = 0; i < n - 1; i++){
    const p = toXZ(ring[i][0], ring[i][1]);
    contour.push(new THREE.Vector2(p[0], p[1]));
  }
  if (contour.length < 3) return;
  let faces = [];
  try { faces = THREE.ShapeUtils.triangulateShape(contour, []); } catch(e){ return; }
  for (const f of faces){
    for (const idx of f){
      const v = contour[idx];
      pos.push(v.x, h, v.y); norm.push(0,1,0); col.push(1,1,1);
    }
  }
  for (let i = 0; i < contour.length; i++){
    const a = contour[i], b = contour[(i+1)%contour.length];
    pos.push(a.x,0,a.y, b.x,0,b.y, b.x,h,b.y);
    pos.push(a.x,0,a.y, b.x,h,b.y, a.x,h,a.y);
    for (let k=0;k<6;k++){ norm.push(0,0,1); col.push(WALL_K, WALL_K, WALL_K); }
  }
}

// ── 건물 지붕 외곽선(엣지 밀도 보강) ──
// 왜: 기준 조감도 대비 엣지밀도 15.8% vs 66.2%(1024w)로 크게 부족했다.
//     건물 윤곽을 1px 라인으로 얹어 형태 식별을 살린다(데이터 변경 없음·렌더만).
function roofEdges(ring, h, out){
  const n = ring.length;
  if (n < 4) return;
  for (let i = 0; i < n - 1; i++){
    const a = toXZ(ring[i][0], ring[i][1]);
    const b = toXZ(ring[i+1][0], ring[i+1][1]);
    out.push(a[0], h, a[1], b[0], h, b[1]);
  }
}

// ── 벽면 모서리 수직 엣지(엣지밀도 보강 후보 c3, 2026-10-23) ──
// 왜: 지붕 외곽선(수평)만으로는 엣지밀도 22.63%(1024w)에서 정체. 기준 조감도(66.12%)는
//     벽면 모서리·수직 구조선까지 엣지로 잡힌다. 각 링 정점에서 바닥(y=0)~지붕(y=h) 수직선을 얹는다.
//     WALL_EDGES=0(기본)이면 아무 것도 하지 않는다(현행 출력 불변). 데이터 변경 없음·렌더만.
function wallEdges(ring, h, out){
  const n = ring.length;
  if (n < 4) return;
  for (let i = 0; i < n - 1; i++){
    const a = toXZ(ring[i][0], ring[i][1]);
    out.push(a[0], 0, a[1], a[0], h, a[1]);
  }
}

// ── 바닥 스타일(뷰어_바닥판과 동일 톤) ──
// 2026-10-22 신안군 보정: 채도 감쇠(DS) — 기준 조감도 대비 채도 과다(54.4 vs 32.9) 실측에 대응.
//   회색축(휘도)으로 38% 당겨 색은 유지하고 채도만 낮춘다.
const DS = 0.62;
function desat(c){
  const g = 0.299*c[0] + 0.587*c[1] + 0.114*c[2];
  return [g + (c[0]-g)*DS, g + (c[1]-g)*DS, g + (c[2]-g)*DS];
}
const STYLE = {
  landuse: {c:desat([0.13,0.18,0.25]), y:0.15, line:false},
  water:   {c:desat([0.20,0.55,0.68]), y:0.25, line:false},
  park:    {c:desat([0.21,0.48,0.31]), y:0.30, line:false},
  green:   {c:desat([0.24,0.52,0.34]), y:0.30, line:false},
  road:    {c:[0.68,0.71,0.77], y:0.55, line:true},
  rail:    {c:[0.45,0.48,0.55], y:0.70, line:true},
};

function inView(bbox, half){
  const [x0,y0,x1,y1] = bbox;
  const a = toXZ(x0, y1), b = toXZ(x1, y0);
  const minX = Math.min(a[0], b[0]), maxX = Math.max(a[0], b[0]);
  const minZ = Math.min(a[1], b[1]), maxZ = Math.max(a[1], b[1]);
  return !(maxX < -half || minX > half || maxZ < -half || minZ > half);
}

// 초기 중심 = '건물이 가장 밀집한 1km 클러스터'의 타일 중심.
// 왜: 행정구역 bbox 중심은 바다·산지일 수 있다(부안군 실측: bbox 중심 1km 안 타일 0개, 최근접 3.16km).
// 2026-10-22 보강: 바닥(ground) 타일이 있는 셀의 건물만 후보로 쓴다.
//   VWorld 건물에는 행정경계 밖 인접 도시가 섞일 수 있어, 그대로 밀집 클러스터를 고르면
//   초기 화면이 경계 밖 도시를 비추고 바닥은 0개가 된다(신안군=목포, 홍천군=춘천 실측).
function pickCenter(tiles, gtiles){
  let cand = tiles;
  if (gtiles && gtiles.length){
    const gk = new Set(gtiles.map(t => t.ti + '_' + t.tj));
    let inside = tiles.filter(t => gk.has(t.ti + '_' + t.tj));
    if (!inside.length){   // 같은 셀에 바닥이 없으면 바닥 셀 2km 이내(1km 타일 기준 ±2) 건물 타일
      inside = tiles.filter(t => {
        for (let di = -2; di <= 2; di++)
          for (let dj = -2; dj <= 2; dj++)
            if (gk.has((t.ti + di) + '_' + (t.tj + dj))) return true;
        return false;
      });
    }
    if (inside.length) cand = inside;
    else cand = gtiles.map(t => ({bbox: t.bbox, buildings: t.features || 1}));   // 바닥만 있는 지역: 바닥 타일 중심
  }
  const pts = cand.map(t => [(t.bbox[0]+t.bbox[2])/2, (t.bbox[1]+t.bbox[3])/2, t.buildings || 1]);
  if (!pts.length) return null;
  if (pts.length > 4000){                       // 대형 지역은 O(n²) 생략: 가장 큰 타일 1개
    pts.sort((a,b) => b[2] - a[2]);
    return [pts[0][0], pts[0][1]];
  }
  let best = null, bestScore = -1;
  for (const p of pts){
    let s = 0;
    for (const q of pts){
      const dx = (q[0]-p[0]) * LON, dy = (q[1]-p[1]) * LAT;
      if (dx*dx + dy*dy <= 1000*1000) s += q[2];
    }
    if (s > bestScore){ bestScore = s; best = p; }
  }
  return best ? [best[0], best[1]] : null;
}

function clearGround(){
  for (const m of [G_FILL, G_LINE]){
    if (m){ scene.remove(m); m.geometry.dispose(); }
  }
  G_FILL = G_LINE = null;
}

async function loadGround(km){
  clearGround();
  const half = (km * 1000) / 2;
  // 바닥 데이터가 없는 지역에서도 '허공'을 없애는 지면판은 항상 깐다(화면 밖까지 넓게 깔아 '돗자리' 느낌 제거)
  if (G_PLANE){ scene.remove(G_PLANE); G_PLANE.geometry.dispose(); G_PLANE = null; }
  const pg = new THREE.PlaneGeometry(km * 1000 * 3.4, km * 1000 * 3.4);
  G_PLANE = new THREE.Mesh(pg, new THREE.MeshLambertMaterial({color:0x263549}));
  G_PLANE.receiveShadow = true;
  G_PLANE.rotation.x = -Math.PI/2; G_PLANE.position.y = -0.4;
  scene.add(G_PLANE);
  if (!GMAN || !G_ON) return {tiles:0, features:0, bytes:0};

  const need = GMAN.tiles.filter(t => inView(t.bbox, half));
  const gpos=[], gcol=[], lpos=[], lcol=[];
  let bytes=0, features=0;
  for (const t of need){
    const txt = await (await fetch(`${ASSET}tiles_1000m/ground/tile_g_${t.ti}_${t.tj}.json`)).text();
    bytes += txt.length;
    const gj = JSON.parse(txt);
    for (const f of gj.features){
      const st = STYLE[f.properties.k]; if (!st) continue;
      const pts = f.geometry.coordinates;
      const closed = f.properties.c && pts.length >= 4;
      features++;
      if (st.line || !closed){
        for (let i=0;i<pts.length-1;i++){
          const a=toXZ(pts[i][0],pts[i][1]), b=toXZ(pts[i+1][0],pts[i+1][1]);
          lpos.push(a[0],st.y,a[1], b[0],st.y,b[1]);
          for (let k=0;k<2;k++) lcol.push(st.c[0],st.c[1],st.c[2]);
        }
      } else {
        // 면 채움: 중심팬은 오목 다각형(강·호수)에서 과대 채움/겹침이 생긴다(화천군 북한강 실측)
        //   → 정식 삼각분할(ShapeUtils) 우선, 실패 시에만 팬 방식으로 폴백
        const ring = [], vec = [];
        for (let i = 0; i < pts.length - 1; i++){
          const q = toXZ(pts[i][0], pts[i][1]);
          ring.push(q); vec.push(new THREE.Vector2(q[0], q[1]));
        }
        if (ring.length < 3) continue;
        // 면 경계 외곽선: 엣지 밀도 보강(2026-10-22 신안군 보정). 색은 원색을 밝게만 한다.
        const bc = [Math.min(1, st.c[0]*2.2), Math.min(1, st.c[1]*2.2), Math.min(1, st.c[2]*2.2)];
        for (let i = 0; i < ring.length; i++){
          const a = ring[i], b = ring[(i+1)%ring.length];
          lpos.push(a[0], st.y+0.02, a[1], b[0], st.y+0.02, b[1]);
          lcol.push(bc[0], bc[1], bc[2], bc[0], bc[1], bc[2]);
        }
        let faces = [];
        try { faces = THREE.ShapeUtils.triangulateShape(vec, []); } catch(e){ faces = []; }
        if (faces.length){
          for (const f of faces) for (const idx of f){
            const v = ring[idx];
            gpos.push(v[0], st.y, v[1]);
            gcol.push(st.c[0], st.c[1], st.c[2]);
          }
        } else {
          let sx = 0, sz = 0;
          for (const q of ring){ sx += q[0]; sz += q[1]; }
          for (let i = 0; i < ring.length; i++){
            const a = ring[i], b = ring[(i+1)%ring.length];
            gpos.push(sx/ring.length, st.y, sz/ring.length, a[0], st.y, a[1], b[0], st.y, b[1]);
            for (let k = 0; k < 3; k++) gcol.push(st.c[0], st.c[1], st.c[2]);
          }
        }
      }
    }
  }
  if (gpos.length){
    const gg = new THREE.BufferGeometry();
    gg.setAttribute('position', new THREE.Float32BufferAttribute(gpos,3));
    gg.setAttribute('color', new THREE.Float32BufferAttribute(gcol,3));
    gg.computeVertexNormals();   // ★ 노멀 없으면 Lambert 조명이 0 → 면이 검게 나온다(실측 적발)
    G_FILL = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide}));
    G_FILL.receiveShadow = true;
    scene.add(G_FILL);
  }
  if (lpos.length){
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.Float32BufferAttribute(lpos,3));
    lg.setAttribute('color', new THREE.Float32BufferAttribute(lcol,3));
    G_LINE = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({vertexColors:true}));
    scene.add(G_LINE);
  }
  return {tiles:need.length, features, bytes};
}

async function loadTiles(km){
  const stat = document.getElementById('stat'), detail = document.getElementById('detail');
  const half = (km * 1000) / 2;
  const need = MAN.tiles.filter(t => inView(t.bbox, half));
  stat.textContent = `타일 ${need.length}개 로딩 중…`;
  const t0 = performance.now();
  let bytes = 0, buildings = 0, tiles0 = 0, tiles1 = 0, tiles2 = 0;
  const pos = [], norm = [], col = [], epos = [];
  for (const t of need){
    const [x0,y0,x1,y1] = t.bbox;
    const c = toXZ((x0+x1)/2, (y0+y1)/2);
    const d = Math.hypot(c[0], c[1]);
    let lod = 'lod0';
    if (d > km * 1000 * 0.66) lod = 'lod2';
    else if (d > km * 1000 * 0.33) lod = 'lod1';
    if (lod === 'lod0') tiles0++; else if (lod === 'lod1') tiles1++; else tiles2++;
    const url = `${ASSET}tiles_1000m/tile_${t.ti}_${t.tj}_${lod}.json`;
    const txt = await (await fetch(url)).text();
    bytes += txt.length;
    const gj = JSON.parse(txt);
    for (const f of gj.features){
      buildings++;
      const h = f.properties.h * HSCALE;
      prism(f.geometry.coordinates[0], h, pos, norm, col);
      roofEdges(f.geometry.coordinates[0], h, epos);
      if (WALL_EDGES) wallEdges(f.geometry.coordinates[0], h, epos);
    }
    loadedTiles.add(url);
  }
  if (MESH){ scene.remove(MESH); MESH.geometry.dispose(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  MESH = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: 0xd8dee9, vertexColors:true, flatShading:true}));
  MESH.castShadow = true; MESH.receiveShadow = true;
  MESH.scale.y = HSCALE_UI;
  scene.add(MESH);
  if (EDGE){ scene.remove(EDGE); EDGE.geometry.dispose(); EDGE = null; }
  if (epos.length){
    const eg = new THREE.BufferGeometry();
    eg.setAttribute('position', new THREE.Float32BufferAttribute(epos, 3));
    EDGE = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color: 0x2f4a66, transparent: true, opacity: 1.0}));
    EDGE.scale.y = HSCALE_UI;
    scene.add(EDGE);
  }

  const gt = await loadGround(km);
  const ms = (performance.now() - t0).toFixed(0);
  stat.innerHTML = `로딩 완료 <b>${need.length}타일</b> · 건물 <b>${buildings.toLocaleString()}동</b>`
    + ` · 바닥 <b>${gt.features.toLocaleString()}개</b>(타일 ${gt.tiles}) · ${ms}ms`;
  detail.textContent = `전송 ${((bytes+gt.bytes)/1024).toFixed(0)} KB (건물 ${(bytes/1024).toFixed(0)}`
    + ` · 바닥 ${(gt.bytes/1024).toFixed(0)}) · LOD0 ${tiles0} / LOD1 ${tiles1} / LOD2 ${tiles2}`
    + ` · 누적 ${loadedTiles.size}`;
  const d = half * 1.6;
  // 초기 시점: 궤도 상태(theta/phi/dist)도 함께 맞춰 첫 드래그·휠에서 화면이 튀지 않게 한다
  theta = Math.atan2(d, d * 0.8);
  dist = Math.hypot(d * 0.8, d * 0.7 - 300, d);
  phi = Math.acos(Math.max(-1, Math.min(1, (d * 0.7 - 300) / dist)));
  updateCam();
}

// ── 최소 궤도 조작 ──
let drag = false, px = 0, py = 0, theta = 0.8, phi = 0.9, dist = 4000;
function updateCam(){
  camera.position.set(
    dist * Math.sin(phi) * Math.cos(theta),
    dist * Math.cos(phi) + 300,
    dist * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(0, 0, 0);
}
renderer.domElement.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; });
addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => {
  if (!drag) return;
  theta -= (e.clientX - px) * 0.006;
  phi = Math.max(0.15, Math.min(1.45, phi - (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY; updateCam();
});
addEventListener('wheel', e => { dist = Math.max(400, Math.min(40000, dist + e.deltaY * 3)); updateCam(); }, {passive:true});
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hsEl = document.getElementById('hs'), hsv = document.getElementById('hsv');
window.__hscale = HSCALE_UI;
hsEl.oninput = () => {

// ── 적용안 3: 지역명·주요 지명 패널 (2026-10-22 만복 22:04 지시) ──
// 왜: 화면에 지역명·지명이 없어 '어디를 보고 있는지' 알 수 없었다.
// 규칙(검증 가능하게 고정): places_osm.geojson 에서 이름 있는 지명만,
//   properties.place(town > village) 우선순위 → 같은 등급은 등장 횟수(내림) → 이름(가나다) 순으로 상위 5개.
//   (kind=bus 인 버스정류장은 place 값이 비어 있어 자동 제외된다.)
//   결과는 패널 텍스트 + window.__places(JSON)로 노출해 QA 스크립트가 숫자로 읽는다.
const PLACE_RANK = {town: 0, village: 1};
async function loadPlaces(){
  const el = document.getElementById('placeNames');
  document.getElementById('regionName').textContent = REGION;
  const out = {region: REGION, names: [], detail: [], total: 0, kinds: {}, place_kinds: {},
               rule: 'place: town>village, count desc, name asc, top5 (bus 제외)', error: ''};
  try {
    const r = await fetch(ASSET + 'places_osm.geojson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const g = await r.json();
    const fs = g.features || [];
    out.total = fs.length;
    const cnt = {};
    for (const f of fs){
      const p = f.properties || {};
      const cat = p.kind || '';        // 분류: place / bus
      const pk = p.place || '';        // 지명 등급: town / village (bus 정류장은 빈 값)
      out.kinds[cat] = (out.kinds[cat] || 0) + 1;
      if (pk) out.place_kinds[pk] = (out.place_kinds[pk] || 0) + 1;
      const nm = (p.name || '').trim();
      if (!nm || !(pk in PLACE_RANK)) continue;
      if (!cnt[nm]) cnt[nm] = {name: nm, kind: pk, count: 0, lon: 0, lat: 0};
      const c = cnt[nm];
      c.count++;
      if (c.kind !== 'town' && pk === 'town') c.kind = 'town';
      if (!c.lon && f.geometry && f.geometry.coordinates){ c.lon = f.geometry.coordinates[0]; c.lat = f.geometry.coordinates[1]; }
    }
    const cand = Object.values(cnt);
    cand.sort((a,b) => (PLACE_RANK[a.kind] - PLACE_RANK[b.kind]) || (b.count - a.count)
                       || a.name.localeCompare(b.name, 'ko'));
    out.detail = cand.slice(0, 5);
    out.names = out.detail.map(c => c.name);
  } catch(e){
    out.error = String((e && e.message) || e);
  }
  el.textContent = out.names.length
    ? `${out.names.join(' · ')} (총 ${out.total}개 · town ${out.place_kinds.town || 0} / village ${out.place_kinds.village || 0})`
    : `지명 없음(${out.error || '파일 없음'})`;
  window.__places = out;
  return out;
}

(async function init(){
  MAN = await (await fetch(ASSET + 'tiles_1000m/tiles_manifest.json')).json();
  try {
    const r = await fetch(ASSET + 'tiles_1000m/ground_manifest.json');
    GMAN = r.ok ? await r.json() : null;
  } catch(e){ GMAN = null; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const t of MAN.tiles){ const [a,b,c,d] = t.bbox; x0=Math.min(x0,a); y0=Math.min(y0,b); x1=Math.max(x1,c); y1=Math.max(y1,d); }
  CENTER = pickCenter(MAN.tiles, GMAN && GMAN.tiles) || [(x0+x1)/2, (y0+y1)/2];   // 바다·산지·경계밖 회피
  document.title = 'READY tiles=' + MAN.tile_count + (GMAN ? ' ground=' + GMAN.tile_count : ' ground=0');
  await loadTiles(KM);
  await loadPlaces();          // 적용안 3: 지역명 + 상위 지명 5개 패널(로컬 파일, 외부 요청 없음)
  updateCam();
  (function loop(){ requestAnimationFrame(loop); renderer.render(scene, camera); })();
})();
</script>
