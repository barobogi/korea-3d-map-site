  });
}

// ── 건물 기둥 삼각분할(BufferGeometry) ──
function prism(ring, h, pos, norm, col){
  if (!ring || ring.length < 3) return;
  const contour = [];
  for (let i = 0; i < ring.length - 1; i++){
    const p = toXZ(ring[i][0], ring[i][1]);
    contour.push(new THREE.Vector2(p[0], p[1]));
  }
  if (contour.length < 3) return;
  let faces = [];
  try { faces = THREE.ShapeUtils.triangulateShape(contour, []); } catch(e){ return; }
  for (const f of faces){
    for (const idx of f){
      const v = contour[idx];
      pos.push(v.x, h, v.y); norm.push(0, 1, 0); col.push(0.85, 0.90, 0.98);
    }
  }
  const wallK = 0.65;
  for (let i = 0; i < contour.length; i++){
    const a = contour[i], b = contour[(i+1)%contour.length];
    pos.push(a.x, 0, a.y, b.x, 0, b.y, b.x, h, b.y);
    pos.push(a.x, 0, a.y, b.x, h, b.y, a.x, h, a.y);
    for (let k = 0; k < 6; k++){ norm.push(0, 0, 1); col.push(wallK, wallK*1.05, wallK*1.15); }
  }
}

function roofEdges(ring, h, out){
  if (!ring || ring.length < 4) return;
  for (let i = 0; i < ring.length - 1; i++){
    const a = toXZ(ring[i][0], ring[i][1]);
    const b = toXZ(ring[i+1][0], ring[i+1][1]);
    out.push(a[0], h + 0.1, a[1], b[0], h + 0.1, b[1]);
  }
}

// ── 건물 타일셋 배경 전체 로딩 ──
async function loadTiles(){
  try {
    const res = await fetch('tiles_1000m/tiles_manifest.json');
    if(!res.ok) return;
    const man = await res.json();
    if(!man || !man.tiles) return;

    // CENTER와 가까운 중심부 타일부터 거리순 정렬
    const sortedTiles = [...man.tiles].sort((a,b) => {
      const ca = toXZ((a.bbox[0]+a.bbox[2])/2, (a.bbox[1]+a.bbox[3])/2);
      const cb = toXZ((b.bbox[0]+b.bbox[2])/2, (b.bbox[1]+b.bbox[3])/2);
      return (ca[0]*ca[0] + ca[1]*ca[1]) - (cb[0]*cb[0] + cb[1]*cb[1]);
    });

    // 랜드마크 160m 반경 클리어런스 (일반 건물 매싱 가림 완전 박멸)
    function isNearLandmark(ring){
      if(!ring || !ring[0]) return false;
      const p = toXZ(ring[0][0], ring[0][1]);
      for(let k = 0; k < BLOCKS.length; k++){
        const bxz = toXZ(BLOCKS[k].coords[0], BLOCKS[k].coords[1]);
        const dx = p[0] - bxz[0], dy = p[1] - bxz[1];
        if(dx * dx + dy * dy < 160 * 160) return true;
      }
      return false;
    }

    const pos = [], norm = [], col = [], epos = [];
    const limit = Math.min(sortedTiles.length, 36);

    for(let i = 0; i < limit; i++){
      const t = sortedTiles[i];
      try {
        const url = 'tiles_1000m/tile_' + t.ti + '_' + t.tj + '_lod1.json';
        const tr = await fetch(url);
        if(!tr.ok) continue;
        const gj = await tr.json();
        if(!gj || !gj.features) continue;

        for(const f of gj.features){
          if(!f.geometry || !f.geometry.coordinates || !f.geometry.coordinates[0]) continue;
          if(isNearLandmark(f.geometry.coordinates[0])) continue; // 랜드마크 가림 방지
          const h = (f.properties && f.properties.h) ? Math.max(8, f.properties.h) : 16;
          prism(f.geometry.coordinates[0], h, pos, norm, col);
          roofEdges(f.geometry.coordinates[0], h, epos);
        }
      } catch(e){}
    }

    if(pos.length){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      const bldgMesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, transparent: true, opacity: 0.90 }));
      scene.add(bldgMesh);
    }

    if(epos.length){
      const eg = new THREE.BufferGeometry();
      eg.setAttribute('position', new THREE.Float32BufferAttribute(epos, 3));
      const edgeLine = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x486581, transparent: true, opacity: 0.7 }));
      scene.add(edgeLine);
    }
  } catch(e){}
}
loadTiles();

// ── 경량 순수 JS glTF 바이너리 파서 ──
function decDataUri(u){
  const b = atob(u.split(',')[1]);
  const a = new Uint8Array(b.length);
  for(let i=0; i<b.length; i++) a[i] = b.charCodeAt(i);
  return a.buffer;
}

function getAccessorData(g, bufs, i){
  const a = g.accessors[i];
  const bv = g.bufferViews[a.bufferView];
  const numComps = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[a.type];
  const T = { 5126: Float32Array, 5125: Uint32Array, 5123: Uint16Array, 5121: Uint8Array }[a.componentType];
  return new T(bufs[bv.buffer], (bv.byteOffset || 0) + (a.byteOffset || 0), a.count * numComps);
}

function buildGltfMesh(g, tex, bufs){
  const mats = (g.materials || [{}]).map(m => {
    const pb = m.pbrMetallicRoughness || {};
    const o = { roughness: pb.roughnessFactor == null ? 0.7 : pb.roughnessFactor, metalness: pb.metallicFactor || 0.1, side: THREE.DoubleSide };
    if(pb.baseColorTexture && tex) o.map = tex;
    else if(pb.baseColorFactor) o.color = new THREE.Color(pb.baseColorFactor[0], pb.baseColorFactor[1], pb.baseColorFactor[2]);
    else if(tex) o.map = tex;
    return new THREE.MeshStandardMaterial(o);
  });
  const root = new THREE.Group();
  g.nodes.forEach(nd => {
    if(nd.mesh == null) return;
    g.meshes[nd.mesh].primitives.forEach(p => {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(getAccessorData(g, bufs, p.attributes.POSITION), 3));
      if(p.attributes.NORMAL != null) geo.setAttribute('normal', new THREE.BufferAttribute(getAccessorData(g, bufs, p.attributes.NORMAL), 3));
      if(p.attributes.TEXCOORD_0 != null) geo.setAttribute('uv', new THREE.BufferAttribute(getAccessorData(g, bufs, p.attributes.TEXCOORD_0), 2));
      if(p.indices != null) geo.setIndex(new THREE.BufferAttribute(getAccessorData(g, bufs, p.indices), 1));
      if(p.attributes.NORMAL == null) geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, mats[p.material || 0]);
      if(nd.translation) m.position.fromArray(nd.translation);
      if(nd.scale) m.scale.fromArray(nd.scale);
      if(nd.rotation) m.quaternion.fromArray(nd.rotation);
      root.add(m);
    });
  });
  return root;
}

// ── 블록별 3D glTF 로더 (LOD3 우선, LOD2 폴백) ──
async function loadBlockGltf(b, xz){
  const dtStatus = document.getElementById('dtStatus');
  dtStatus.textContent = '3D 실물 모델 로딩 중…';
  const base = 'blocks/' + b.folder + '/';
  try {
    let gltfRes = await fetch(base + 'model_lod3.gltf').catch(() => null);
    let lodName = 'LOD3 고정밀';
    if(!gltfRes || !gltfRes.ok){
      gltfRes = await fetch(base + 'model_lod2.gltf').catch(() => null);
      lodName = 'LOD2 경량';
    }
    if(!gltfRes || !gltfRes.ok) throw new Error('gltf not found');
    const g = await gltfRes.json();
    
    const bufs = await Promise.all(g.buffers.map(buf => {
      if(buf.uri.startsWith('data:')) return Promise.resolve(decDataUri(buf.uri));
      return fetch(base + buf.uri).then(r => r.arrayBuffer());
    }));

    const texLoader = new THREE.TextureLoader();
    texLoader.load(base + 'texture_atlas.webp', (tex) => {
      tex.flipY = true;
      if(THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
      mountGltf(g, tex, bufs, xz, b, lodName);
    }, undefined, () => {
      mountGltf(g, null, bufs, xz, b, lodName);
    });
  } catch(e) {
    dtStatus.textContent = '3D 랜드마크 핀 위치 확인됨';
  }
}

function mountGltf(g, tex, bufs, xz, b, lodName){
  if(activeGltfMesh) gltfHolderGroup.remove(activeGltfMesh);
  activeGltfMesh = buildGltfMesh(g, tex, bufs);
  
  // 크기 자동 정규화 및 바닥 안착 (숭례문 등 문화재/저층 모델 스케일 보정)
  const bb = new THREE.Box3().setFromObject(activeGltfMesh);
  const sz = bb.getSize(new THREE.Vector3());
  const maxDim = Math.max(sz.x, sz.z);
  let targetScale = 1.0;
  if (sz.y > 200) {
    // 롯데월드타워 등 초고층 타워
    targetScale = Math.min(2.0, Math.max(0.8, 110 / (maxDim || 100)));
  } else if (sz.y < 50) {
    // 숭례문 등 저층 랜드마크 디테일 극대화 (중앙에서 작게 보이는 문제 해결)
    targetScale = Math.min(3.8, Math.max(1.2, 140 / (maxDim || 60)));
  } else {
    // 코엑스 등 중고층 랜드마크
    targetScale = Math.min(2.8, Math.max(0.8, 120 / (maxDim || 100)));
  }
  activeGltfMesh.scale.set(targetScale, targetScale, targetScale);
  
  // 정밀 위치 배치
  activeGltfMesh.position.set(xz[0], 2, xz[1]);
  gltfHolderGroup.add(activeGltfMesh);

  // 선택된 블록 핀 및 링 100% 완전 숨김 (모델 위에 겹치지 않게)
  markerObjects.forEach(m => {
    if (m.block.no === b.no) {
      m.group.visible = false;
      m.pin.visible = false;
      m.ring.visible = false;
    } else {
      m.group.visible = true;
      m.pin.visible = true;
      m.ring.visible = true;
    }
  });

  // 만복 감사 지침: 시선 기준점을 타워 높이의 50%로 상승 및 거리 확보 (상단 잘림 완전 박멸)
  const scaledH = sz.y * targetScale;
  const scaledDim = Math.max(sz.x, sz.z) * targetScale;
  let camDist, camH, lookH;
  if (scaledH > 250) {
    // 555m 롯데월드타워: 시선점을 타워 중심(약 280m)으로 올리고 거리 1200m로 후퇴
    const midH = scaledH * 0.50;
    camDist = Math.max(scaledH * 1.9, 1200);
    camH = midH + 60;
    lookH = midH;
  } else if (scaledH < 60) {
    // 숭례문: 근접 앵글로 웅장함과 기와 지붕 텍스처 극대화
    camDist = Math.max(scaledDim * 1.7, 160);
    camH = Math.max(scaledH * 1.1, 55);
    lookH = scaledH * 0.40;
  } else {
    // 일반 블록
    camDist = Math.max(scaledDim * 2.2, scaledH * 1.4, 320);
    camH = Math.max(scaledH * 0.8, 140);
    lookH = scaledH * 0.45;
  }
  targetCam = new THREE.Vector3(xz[0], camH, xz[1] + camDist);
  targetLook = new THREE.Vector3(xz[0], lookH, xz[1]);

  let tri = 0;
  activeGltfMesh.traverse(o => { if(o.geometry) tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  document.getElementById('dtStatus').textContent = `✅ 3D 실물 모델 (${lodName}) 렌더링 완료 · 삼각형 ${Math.round(tri).toLocaleString()}개`;
}

// ── 사이드바 UI 렌더링 ──
function renderSidebar(list){
  const el = document.getElementById('blockList');
  el.innerHTML = '';
  list.forEach(b => {
    const item = document.createElement('div');
    item.className = 'block-item';
    item.id = 'block-item-' + b.no;
    item.onclick = () => flyToBlock(b);
    item.innerHTML = `
      <div class="block-item-top">
        <span class="block-no">${b.no}</span>
        <span class="block-name" title="${b.name}">${b.name}</span>
      </div>
      <div class="block-meta">
        <span class="block-cat">${b.cat}</span>
        <span class="block-addr" title="${b.addr}">${b.addr}</span>
      </div>
    `;
    el.appendChild(item);
  });
  document.getElementById('count-badge').textContent = list.length + '개';
}
renderSidebar(BLOCKS);

function filterBlocks(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){
    renderSidebar(BLOCKS);
    return;
  }
  const filtered = BLOCKS.filter(b => 
    b.name.toLowerCase().includes(q) || 
    b.cat.toLowerCase().includes(q) || 
    b.addr.toLowerCase().includes(q) ||
    String(b.no).includes(q)
  );
  renderSidebar(filtered);
}

// ── 블록 이동 & 상세 표시 & glTF 마운트 ──
let targetCam = null, targetLook = null;
let isOrbiting = false;

function flyToBlock(b){
  const xz = toXZ(b.coords[0], b.coords[1]);
  targetCam = new THREE.Vector3(xz[0], 220, xz[1] + 280);
  targetLook = new THREE.Vector3(xz[0], 35, xz[1]);
  
  // 마커 즉시 숨김/하이라이트 (선택 블록은 핀 완전 제거)
  markerObjects.forEach(m => {
    const match = (m.block.no === b.no);
    if (match) {
      m.group.visible = false;
      m.pin.visible = false;
      m.ring.visible = false;
    } else {
      m.group.visible = true;
      m.pin.visible = true;
      m.ring.visible = true;
      m.pin.material.color.setHex(0x38bdf8);
      m.pin.scale.set(1.0, 1.0, 1.0);
    }
  });
  
  // 사이드바 active 표시
  document.querySelectorAll('.block-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById('block-item-' + b.no);
  if(activeEl){
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 모달 표시
  document.getElementById('dtName').textContent = b.name;
  document.getElementById('dtCat').textContent = '분류: ' + b.cat;
  document.getElementById('dtAddr').textContent = '주소: ' + b.addr;
  document.getElementById('dtCoords').textContent = '좌표: ' + b.coords[0].toFixed(5) + ', ' + b.coords[1].toFixed(5);
  document.getElementById('block-detail').style.display = 'flex';

  // 3D glTF 로드 및 실물 표시
  loadBlockGltf(b, xz);
}

function closeDetail(){
  document.getElementById('block-detail').style.display = 'none';
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.body.classList.toggle('ui-collapsed', sb.classList.contains('collapsed'));
}

function resetView(){
  targetCam = new THREE.Vector3(0, 900, 1400);
  targetLook = new THREE.Vector3(0, 30, 0);
  closeDetail();
}

function toggleOrbit(){
  isOrbiting = !isOrbiting;
  const btn = document.getElementById('btnOrbit');
  btn.style.background = isOrbiting ? '#0284c7' : '';
}

// 부드러운 카메라 보간 및 렌더 루프
function animate(){
  requestAnimationFrame(animate);
  
  if(targetCam && targetLook){
    camera.position.lerp(targetCam, 0.05);
    const curLook = new THREE.Vector3();
    camera.getWorldDirection(curLook);
    if(camera.position.distanceTo(targetCam) < 2){
      targetCam = null;
    }
  }

  if(isOrbiting){
    scene.rotation.y += 0.0015;
  }

  renderer.render(scene, camera);
}
animate();

// 1번 블록 기본 프리로드
setTimeout(() => {
  if(BLOCKS && BLOCKS.length){
    flyToBlock(BLOCKS[0]);
  }
}, 800);

// 윈도우 리사이즈
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
