function toXZ(lon, lat){
  return [(lon - CENTER[0]) * LON, -(lat - CENTER[1]) * LAT];
}

// Three.js 씬 초기화
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b111e);
scene.fog = new THREE.FogExp2(0x0b111e, 0.00018);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 10, 35000);
camera.position.set(0, 1300, 1800);
camera.lookAt(0, 40, 0);

document.body.appendChild(renderer.domElement);

// 조명 설정

// 기본 베이스 지면
const groundGeo = new THREE.PlaneGeometry(30000, 30000);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x121b2d, depthWrite: true });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -1;

// 3D 마커 그룹
const markerGroup = new THREE.Group();
scene.add(markerGroup);
const markerObjects = [];

// 블록 50개 3D 마커 생성
function createMarkers(){
  const pinGeo = new THREE.CylinderGeometry(0, 16, 60, 8);
  pinGeo.rotateX(Math.PI);
  
  BLOCKS.forEach((b, idx) => {
    const xz = toXZ(b.coords[0], b.coords[1]);
    const pinMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const pin = new THREE.Mesh(pinGeo, pinMat);
    pin.position.set(xz[0], 50, xz[1]);
    
    // 바닥 링
    const ringGeo = new THREE.RingGeometry(18, 26, 16);
    ringGeo.rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.set(xz[0], 2, xz[1]);
    
    const obj = new THREE.Group();
    obj.add(pin);
    obj.add(ring);
    obj.userData = { block: b, index: idx };
    markerGroup.add(obj);
    markerObjects.push({ group: obj, pin: pin, ring: ring, block: b, index: idx });
  });
}
createMarkers();

// 건물 타일셋 로딩
async function loadTiles(){
  try {
    const res = await fetch('tiles_1000m/tiles_manifest.json');
    if(!res.ok) return;
    const man = await res.json();
    if(!man || !man.tiles) return;

    const bMat = new THREE.MeshLambertMaterial({ color: 0x5a708e });
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x9fb6d6, transparent: true, opacity: 0.45 });

    for(const t of man.tiles){
      try {
        const tr = await fetch('tiles_1000m/tile_' + t.ti + '_' + t.tj + '_lod1.json');
        if(!tr.ok) continue;
        const data = await tr.json();
        if(!data || !data.buildings) continue;

        data.buildings.forEach(bd => {
          if(!bd.pts || bd.pts.length < 3) return;
          const shape = new THREE.Shape();
          const first = toXZ(bd.pts[0][0], bd.pts[0][1]);
          shape.moveTo(first[0], -first[1]);
          for(let i=1; i<bd.pts.length; i++){
            const pt = toXZ(bd.pts[i][0], bd.pts[i][1]);
            shape.lineTo(pt[0], -pt[1]);
          }
          const height = Math.max(8, bd.h || 15);
          const extGeo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
          extGeo.rotateX(-Math.PI / 2);
          const mesh = new THREE.Mesh(extGeo, bMat);
          mesh.position.y = 0;
          scene.add(mesh);
        });
      } catch(e){}
    }
  } catch(e){}
}
loadTiles();

      <div class="block-meta">
        <span class="block-cat">${b.cat}</span>
        <span class="block-addr" title="${b.addr}">${b.addr}</span>
      </div>
    `;
    el.appendChild(item);
  });
  document.getElementById('count-badge').textContent = list.length + '개';
}
renderSidebar(BLOCKS);

function filterBlocks(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){
    renderSidebar(BLOCKS);
    return;
  }
  const filtered = BLOCKS.filter(b => 
    b.name.toLowerCase().includes(q) || 
    b.cat.toLowerCase().includes(q) || 
    b.addr.toLowerCase().includes(q) ||
    String(b.no).includes(q)
  );
  renderSidebar(filtered);
}

// 블록 이동 & 상세 표시
let targetCam = null, targetLook = null;
let isOrbiting = false;

function flyToBlock(b){
  const xz = toXZ(b.coords[0], b.coords[1]);
  targetCam = new THREE.Vector3(xz[0], 280, xz[1] + 360);
  targetLook = new THREE.Vector3(xz[0], 40, xz[1]);
  
  // 마커 하이라이트
  markerObjects.forEach(m => {
    const match = (m.block.no === b.no);
    m.pin.material.color.setHex(match ? 0xfde047 : 0x38bdf8);
    m.pin.scale.set(match ? 1.8 : 1.0, match ? 1.8 : 1.0, match ? 1.8 : 1.0);
  });
  
  // 사이드바 active 표시
  document.querySelectorAll('.block-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById('block-item-' + b.no);
  if(activeEl){
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 모달 표시
  document.getElementById('dtName').textContent = b.name;
  document.getElementById('dtCat').textContent = '분류: ' + b.cat;
  document.getElementById('dtAddr').textContent = '주소: ' + b.addr;
  document.getElementById('dtCoords').textContent = '좌표: ' + b.coords[0].toFixed(5) + ', ' + b.coords[1].toFixed(5);
  document.getElementById('block-detail').style.display = 'flex';
}

function closeDetail(){
  document.getElementById('block-detail').style.display = 'none';
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.body.classList.toggle('ui-collapsed', sb.classList.contains('collapsed'));
}

function resetView(){
  targetCam = new THREE.Vector3(0, 1300, 1800);
  targetLook = new THREE.Vector3(0, 40, 0);
  closeDetail();
}

function toggleOrbit(){
  isOrbiting = !isOrbiting;
  const btn = document.getElementById('btnOrbit');
  btn.style.background = isOrbiting ? '#0284c7' : '';
}

// 부드러운 카메라 보간 및 렌더 루프
function animate(){
  requestAnimationFrame(animate);
  
  if(targetCam && targetLook){
    camera.position.lerp(targetCam, 0.05);
    const curLook = new THREE.Vector3();
    camera.getWorldDirection(curLook);
    // 간단 보간
    if(camera.position.distanceTo(targetCam) < 2){
      targetCam = null;
    }
  }

  if(isOrbiting){
    scene.rotation.y += 0.0015;
  }

  renderer.render(scene, camera);
}
animate();

// 윈도우 리사이즈
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
